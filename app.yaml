services:

  s3app:
    image: node:18
    container_name: 68-s3-app
    tty: true
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: 68-s3-postgres
    restart: always
    environment:
      POSTGRES_USER: sudthikarn
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: sudthikarn
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4:8
    container_name: 68-s3-admin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
