version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: 68-s3-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DATABASE_PORT}:5432"

  strapi:
    image: prawee/strapi
    container_name: 68-s3-app
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}

      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASS}
    ports:
      - "${APP_PORT}:1337"

  admin:
    image: dpage/pgadmin4:8
    container_name: 68-s3-admin
    restart: always
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres

volumes:
  pgdata:
